name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Billyjameshowell/shiny-hunt-tracker'
    steps:
      - uses: actions/checkout@v4

      - name: Check for Fly.io token
        id: token
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN secret is not set — skipping deploy. Add it in GitHub repo Settings → Secrets → Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.configured == 'true'

      - name: Deploy to Fly.io
        if: steps.token.outputs.configured == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        if: steps.token.outputs.configured == 'true'
        run: |
          sleep 15
          curl --fail --retry 5 --retry-delay 5 https://shiny-hunt-tracker.fly.dev/api/health
