<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="index,follow">
  <meta name="description" content="Track Pokemon shiny hunts with fast encounter counters, shiny odds, target progress, trophy cabinet, stats, and offline-ready PWA support.">
  <meta name="keywords" content="shiny hunt tracker, Pokemon shiny tracker, shiny odds calculator, Pokemon encounter counter, shiny Pokemon counter">
  <meta name="author" content="Shiny Hunt Tracker">
  <link rel="canonical" href="https://shiny-hunt-tracker.fly.dev/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shiny Hunt Tracker">
  <meta property="og:description" content="A fast offline-ready Pokemon shiny hunt counter with odds, progress targets, stats, and a trophy cabinet.">
  <meta property="og:url" content="https://shiny-hunt-tracker.fly.dev/">
  <meta property="og:site_name" content="Shiny Hunt Tracker">
  <meta property="og:image" content="https://shiny-hunt-tracker.fly.dev/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shiny Hunt Tracker">
  <meta name="twitter:description" content="Track Pokemon shiny hunts with encounter counters, shiny odds, stats, and offline support.">
  <meta name="twitter:image" content="https://shiny-hunt-tracker.fly.dev/og-image.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Shiny Hunt Tracker | Pokemon Encounter Counter & Trophy Cabinet</title>
  <link rel="stylesheet" href="styles.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Shiny Hunt Tracker",
      "url": "https://shiny-hunt-tracker.fly.dev/",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "description": "Track Pokemon shiny hunts with encounter counters, shiny odds, target progress, stats, a trophy cabinet, and offline PWA support.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
</head>
<body>

  <!-- PWA install banner -->
  <div id="install-banner" class="install-banner hidden">
    <span>📱 Install for offline access</span>
    <button id="install-btn">Install</button>
    <button id="dismiss-install" aria-label="Dismiss">✕</button>
  </div>

  <!-- Offline indicator -->
  <div id="offline-bar" class="offline-bar hidden">
    📴 Offline — changes will sync when reconnected
  </div>

  <div class="app">

    <!-- Header -->
    <header class="app-header">
      <img src="/icon.svg" alt="" class="app-logo" width="40" height="40">
      <h1>Shiny Hunt Tracker</h1>
      <div id="sync-badge" class="sync-badge hidden" aria-live="polite">Syncing…</div>
    </header>

    <!-- Stats bar -->
    <div class="stats-bar" role="region" aria-label="Summary stats">
      <div class="stat-pill">
        <span class="stat-label">Active</span>
        <span class="stat-value" id="stat-active">0</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Found</span>
        <span class="stat-value" id="stat-found">0</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Encounters</span>
        <span class="stat-value" id="stat-encounters">0</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Avg / Shiny</span>
        <span class="stat-value" id="stat-avg">—</span>
      </div>
    </div>

    <!-- Tab navigation -->
    <nav class="tab-nav" role="tablist" aria-label="Main navigation">
      <button id="tab-btn-hunt" class="tab-btn active" data-tab="hunt" role="tab" aria-selected="true" aria-controls="tab-hunt" aria-label="Hunt">🔍 <span class="tab-label">Hunt</span></button>
      <button id="tab-btn-trophy" class="tab-btn" data-tab="trophy" role="tab" aria-selected="false" aria-controls="tab-trophy" aria-label="Trophy cabinet">🏆 <span class="tab-label">Trophy</span></button>
      <button id="tab-btn-stats" class="tab-btn" data-tab="stats" role="tab" aria-selected="false" aria-controls="tab-stats" aria-label="Statistics">📊 <span class="tab-label">Stats</span></button>
    </nav>

    <!-- ═══════════════════════════ HUNT TAB ═══════════════════════════ -->
    <div id="tab-hunt" class="tab-content active" role="tabpanel" aria-labelledby="tab-btn-hunt" aria-hidden="false">

      <!-- New hunt form -->
      <section class="new-hunt-panel">
        <h2>Start New Hunt</h2>

        <div class="search-container">
          <input type="text" id="pokemon-search" placeholder="Search Pokémon…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
          <div id="search-results" class="search-results" role="listbox"></div>
        </div>

        <!-- Selected Pokémon preview -->
        <div id="selected-preview" class="selected-preview hidden">
          <img id="selected-sprite" src="" alt="">
          <div class="selected-info">
            <div id="selected-name" class="selected-name"></div>
            <div id="selected-types" class="selected-types"></div>
          </div>
          <button id="clear-selection" class="clear-btn" aria-label="Clear selection">✕</button>
        </div>

        <!-- Game select -->
        <select id="game-select">
          <option value="">Select Game…</option>
          <optgroup label="Gen 1 (no shiny mechanic)">
            <option value="Red/Blue" disabled>Red / Blue — no shinies</option>
            <option value="Yellow" disabled>Yellow — no shinies</option>
          </optgroup>
          <optgroup label="Gen 2 — 1/8192">
            <option value="Gold/Silver">Gold / Silver</option>
            <option value="Crystal">Crystal</option>
          </optgroup>
          <optgroup label="Gen 3 — 1/8192">
            <option value="Ruby/Sapphire">Ruby / Sapphire</option>
            <option value="Emerald">Emerald</option>
            <option value="FireRed/LeafGreen">FireRed / LeafGreen</option>
          </optgroup>
          <optgroup label="Gen 4 — 1/8192">
            <option value="Diamond/Pearl">Diamond / Pearl</option>
            <option value="Platinum">Platinum</option>
            <option value="HeartGold/SoulSilver">HeartGold / SoulSilver</option>
          </optgroup>
          <optgroup label="Gen 5 — 1/8192">
            <option value="Black/White">Black / White</option>
            <option value="Black 2/White 2">Black 2 / White 2</option>
          </optgroup>
          <optgroup label="Gen 6 — 1/4096">
            <option value="X/Y">X / Y</option>
            <option value="Omega Ruby/Alpha Sapphire">Omega Ruby / Alpha Sapphire</option>
          </optgroup>
          <optgroup label="Gen 7 — 1/4096">
            <option value="Sun/Moon">Sun / Moon</option>
            <option value="Ultra Sun/Ultra Moon">Ultra Sun / Ultra Moon</option>
          </optgroup>
          <optgroup label="Gen 8 — 1/4096">
            <option value="Sword/Shield">Sword / Shield</option>
            <option value="Brilliant Diamond/Shining Pearl">Brilliant Diamond / Shining Pearl</option>
            <option value="Legends: Arceus">Legends: Arceus</option>
          </optgroup>
          <optgroup label="Gen 9 — 1/4096">
            <option value="Scarlet/Violet">Scarlet / Violet</option>
          </optgroup>
        </select>

        <!-- Optional target -->
        <div class="target-row">
          <label for="target-count">Target encounters (optional)</label>
          <input type="number" id="target-count" placeholder="e.g. 500" min="1" max="99999">
        </div>

        <p id="start-hunt-hint" class="form-hint">Select a Pokémon and game to continue</p>
        <button id="start-hunt" disabled>Start Hunt ✨</button>
      </section>

      <!-- Active hunts grid -->
      <section class="hunts-section">
        <h2>Active Hunts</h2>
        <div id="hunts-container" class="hunts-grid"></div>
      </section>

    </div><!-- /tab-hunt -->

    <!-- ═══════════════════════════ TROPHY TAB ═══════════════════════════ -->
    <div id="tab-trophy" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-trophy" aria-hidden="true">
      <section class="trophy-section">
        <h2>🏆 Trophy Cabinet</h2>
        <p class="section-subtitle">Your found shinies</p>
        <div id="trophy-container" class="trophy-grid"></div>
      </section>
    </div>

    <!-- ═══════════════════════════ STATS TAB ═══════════════════════════ -->
    <div id="tab-stats" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-stats" aria-hidden="true">
      <section class="full-stats-section">
        <h2>📊 Hunt Statistics</h2>
        <div id="stats-container" class="stats-grid"></div>
      </section>
    </div>

  </div><!-- /app -->

  <!-- ═══════════════════════════ FOUND OVERLAY ═══════════════════════════ -->
  <div id="found-overlay" class="found-overlay hidden" role="dialog" aria-modal="true" aria-label="Shiny found celebration">
    <div class="found-modal">
      <div class="overlay-sparkles" id="overlay-sparkles"></div>
      <img id="found-sprite" src="" alt="" class="found-sprite-img">
      <h2>✨ SHINY FOUND! ✨</h2>
      <p id="found-message"></p>
      <button id="found-confirm">Add to Trophy Cabinet 🏆</button>
      <button id="found-cancel" class="found-cancel-btn">Not yet — keep counting</button>
    </div>
  </div>

  <!-- ═══════════════════════════ CONFIRM OVERLAY ═══════════════════════════ -->
  <div id="confirm-overlay" class="confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-modal">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <button id="confirm-action" class="confirm-action-btn"></button>
      <button id="confirm-cancel" class="confirm-cancel-btn">Cancel</button>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
